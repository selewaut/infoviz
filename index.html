<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Santiago Elewaut - ITBA - Data Science - 2026</title>
  <style>
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      color: #222;
    }
    h1 {
      font-size: 1.6rem;
    }
    object {
      max-width: 100%;
    }
    .flourish-embed {
      width: 100%;
    }
    section + section {
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <section>
    <h1>Portfolio Visualization</h1>
    <p>A tile chart of my portfolio, sized by each asset's value and colored by its daily change.</p>

    <object type="image/svg+xml" data="./images/finance.svg">
      <img src="./images/finance.svg" alt="Portfolio tile chart">
    </object>
  </section>

  <section>
    <h1>Rendimiento Pesos</h1>
    <div class="flourish-embed flourish-chart" data-src="visualisation/30757619">
      <script src="https://public.flourish.studio/resources/embed.js"></script>
      <noscript>
        <img src="https://public.flourish.studio/visualisation/30757619/thumbnail" width="100%" alt="chart visualization">
      </noscript>
    </div>
  </section>

  <section>
    <h1>Toppings on pizza male vs female</h1>
    <iframe title="Toppings on pizza male vs female" aria-label="Range Plot" id="datawrapper-chart-QkyKp" src="https://datawrapper.dwcdn.net/QkyKp/1/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="433" data-external="1"></iframe>
    <script type="text/javascript">(function(){function e(){window.addEventListener(`message`,function(e){if(e.data[`datawrapper-height`]!==void 0){var t=document.querySelectorAll(`iframe`);for(var n in e.data[`datawrapper-height`])for(var r=0,i;i=t[r];r++)if(i.contentWindow===e.source){var a=e.data[`datawrapper-height`][n]+`px`;i.style.height=a}}})}e()})();</script>
  </section>

</body>
</html>
