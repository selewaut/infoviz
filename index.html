<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Santiago Elewaut - ITBA - Data Science - 2026</title>
  <style>
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      color: #222;
    }
    h1 {
      font-size: 1.6rem;
    }
    object {
      max-width: 100%;
    }
    section + section {

<body>
  <section>
    <h1>Portfolio Visualization</h1>
    <p>A tile chart of my portfolio, sized by each asset's value and colored by its daily change.</p>

    <object type="image/svg+xml" data="./images/finance.svg">
      <img src="./images/finance.svg" alt="Portfolio tile chart">
    </object>
  </section>

  <section>
    <h1>Music Industry Revenues</h1>
    <p>A streamgraph of inflation-adjusted music industry revenues by format, from vinyl and tape through disc, download, and streaming.</p>

    <object type="image/svg+xml" data="./images/bumpchart.svg">
      <img src="./images/bumpchart.svg" alt="Music industry revenue streamgraph">
    </object>
  </section>

</body>
</html>
