 sans-serif" font-size="10" x="4" fill="black" font-weight="bold" text-anchor="start" dominant-baseline="hanging">Industry_Group</text></g></g><text y="4" x="4" style="font-family: Arial, sans-serif; font-size: 12px; fill: black; font-weight: bold; dominant-baseline: hanging;"/></g></g><script><![CDATA[
(function () {
  var svg = document.querySelector('svg');
  var NS = 'http://www.w3.org/2000/svg';
  var tip = document.createElementNS(NS, 'g');
  tip.setAttribute('pointer-events', 'none');
  tip.style.display = 'none';
  var box = document.createElementNS(NS, 'rect');
  box.setAttribute('rx', '6');
  box.setAttribute('fill', '#111827');
  var label = document.createElementNS(NS, 'text');
  label.setAttribute('fill', '#ffffff');
  label.setAttribute('font-family', 'Arial, sans-serif');
  label.setAttribute('font-size', '13');
  label.setAttribute('x', '10');
  label.setAttribute('y', '7');
  label.setAttribute('dominant-baseline', 'hanging');
  tip.appendChild(box);
  tip.appendChild(label);
  svg.appendChild(tip);

  function hide() {
    tip.style.display = 'none';
  }

  function show(evt, value) {
    label.textContent = value;
    tip.style.display = 'block';
    var b = label.getBBox();
    var w = b.width + 20;
    var h = b.height + 14;
    box.setAttribute('width', w);
    box.setAttribute('height', h);
    var p = svg.createSVGPoint();
    p.x = evt.clientX;
    p.y = evt.clientY;
    var loc = p.matrixTransform(svg.getScreenCTM().inverse());
    var vb = svg.viewBox.baseVal;
    var x = Math.min(loc.x + 14, vb.width - w - 6);
    var y = Math.max(loc.y - h - 12, 6);
    tip.setAttribute('transform', 'translate(' + x + ',' + y + ')');
  }

  var rects = svg.querySelectorAll('.bars rect');
  Array.prototype.forEach.call(rects, function (rect) {
    var t = rect.querySelector('title');
    if (!t) return;
    var value = t.textContent;
    rect.setAttribute('aria-label', value);
    rect.removeChild(t);
    rect.addEventListener('mousemove', function (evt) { show(evt, value); });
    rect.addEventListener('mouseleave', hide);
  });
})();
]]></script></svg>